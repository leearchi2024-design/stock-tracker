name: 更新股市資料並發布

on:
  schedule:
    - cron: "17 0 * * 1-6"   # 台灣 08:17：美股收盤、費半、台積電 ADR、早盤新聞
    - cron: "43 6 * * 1-5"   # 台灣 14:43：上市櫃收盤價
    - cron: "38 8 * * 1-5"   # 台灣 16:38：三大法人、本益比
    - cron: "47 14 * * 1-5"  # 台灣 22:47：融資餘額、晚間新聞
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backfill:
        description: "補抓最近幾個交易日的歷史（0 = 不補；第一次執行會自動補 70 天）"
        default: "0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 檢查程式
        run: node scripts/test.mjs

      - name: 組裝網站
        run: |
          mkdir -p _site
          cp index.html style.css app.js core.js sync.js config.js manifest.webmanifest _site/
          cp -r icons _site/
          # 每次發布換版本號，瀏覽器才不會沿用舊的程式
          sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" _site/index.html _site/app.js
          touch _site/.nojekyll

      - name: 抓公開股市資料
        env:
          BACKFILL: ${{ inputs.backfill || '0' }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          export SITE_URL="https://${owner}.github.io/${repo}"
          node scripts/fetch-data.mjs _site/data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

      # 公開 repo 超過 60 天沒有任何 commit，GitHub 會自動停用排程。超過 40 天就補一個小 commit。
      - name: 保持排程啟用
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( ($(date +%s) - last) / 86400 )) -ge 40 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u +%F > .github/keepalive.txt
            git add .github/keepalive.txt
            git commit -m "chore: 保持排程啟用"
            git push
          fi
